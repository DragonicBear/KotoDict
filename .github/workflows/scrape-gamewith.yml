name: Scrape GameWith Units

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:      # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install axios cheerio
      
      - name: Scrape and update
        run: node scrape-gamewith.js
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GameWith Scraper"
          git add units.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update units from GameWith" && git push)

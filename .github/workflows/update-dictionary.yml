name: Update Kotodaman Dictionary

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Run scraper
        run: node scrape-dictionary.js

      - name: Push dictionary to gh-pages
        run: |
          cp data/dictionary.json /tmp/dictionary.json

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch origin gh-pages
          git checkout gh-pages

          mkdir -p data
          cp /tmp/dictionary.json data/dictionary.json

          git add data/dictionary.json
          git diff --cached --quiet || git commit -m "chore: update dictionary $(date +%Y-%m-%d)"
          git push origin gh-pages

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Kotodaman Board Solver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); }
        html, body { width: 100%; height: 100%; overflow-x: hidden; position: fixed; -webkit-overflow-scrolling: touch; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; background: #f5f5f5; -webkit-touch-callout: none; overscroll-behavior: none; }
        #app { width: 100%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px; }
        .container { max-width: 800px; margin: 0 auto 60px; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        h1 { font-size: 24px; margin-bottom: 20px; color: #333; font-weight: 600; text-align: center; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .input-section { background: #f8f9fa; padding: 20px; border-radius: 12px; border: 1px solid #e0e0e0; margin-bottom: 15px; }
        .pos-filter-container { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 2px; width: 100%; }
        .pos-filter-container > div { position: relative; width: 100%; aspect-ratio: 1/1; min-width: 0; }
        .pos-labels-container { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 0; }
        .pos-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 0; margin: 0; font-size: 18px; font-weight: bold; text-align: center; border: 2px solid #ddd; border-radius: 8px; background: #fff; -webkit-appearance: none; appearance: none; transition: all 0.2s; overflow: hidden; white-space: nowrap; }
        .pos-input:focus { border-color: #007AFF; outline: none; background: #fff; }
        .pos-input.filled { background: #f0f8ff; border-color: #007AFF; }
        .pos-label { font-size: 11px; color: #999; text-align: center; margin-top: 4px; height: 16px; }
        .cell-toggle { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: #e0e0e0; color: #666; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; pointer-events: auto; border: 1px solid #ccc; transition: 0.15s; user-select: none; }
        .cell-toggle.free { background: #34c759; color: white; border-color: #28a745; }
        .cell-toggle.board { background: #e0e0e0; color: #666; border-color: #ccc; }
        .pos-clear-container { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; width: 100%; }
        .pos-clear { width: 100%; height: 22px; border-radius: 4px; background: #ff3b30; color: white; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; padding: 0; line-height: 1; }
        .action-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-top: 15px; gap: 10px; }
        .sort-select { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; background: white; font-size: 14px; }
        button { padding: 8px 16px; font-size: 14px; border: none; border-radius: 6px; background: #8E8E93; color: white; font-weight: 500; cursor: pointer; transition: background 0.1s; }
        button:active { background: #636366; transform: scale(0.97); }
        button.primary { background: #007AFF; }
        .filters { margin-bottom: 15px; padding: 0 5px; }
        .filter-row { margin: 12px 0; display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
        .filter-label { font-weight: 600; color: #333; min-width: 60px; font-size: 15px; padding-top: 4px; }
        .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .theme-checklist-container { flex: 1; min-width: 200px; position: relative; }
        .theme-toggle-btn { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; background: white; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; max-width: 280px; }
        .theme-toggle-btn .selected-count { background: #007AFF; color: white; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600; display: none; }
        .theme-toggle-btn .selected-count.has-selection { display: inline; }
        .theme-dropdown { display: none; position: absolute; top: 100%; left: 0; z-index: 50; background: white; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); max-height: 300px; overflow-y: auto; min-width: 280px; margin-top: 4px; }
        .theme-dropdown.open { display: block; }
        .theme-dropdown .theme-option { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
        .theme-dropdown .theme-option:hover { background: #f5f5f5; }
        .theme-dropdown .theme-option input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #007AFF; }
        .theme-dropdown .theme-option .theme-count { color: #999; font-size: 11px; margin-left: auto; }
        .theme-dropdown .theme-actions { padding: 8px 12px; display: flex; gap: 8px; border-top: 1px solid #eee; position: sticky; bottom: 0; background: white; }
        .theme-dropdown .theme-actions button { flex: 1; padding: 6px 10px; font-size: 12px; }
        .theme-search-input { width: 100%; padding: 8px 12px; border: none; border-bottom: 1px solid #eee; font-size: 13px; outline: none; }
        input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: #007AFF; }
        label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 15px; padding: 4px 0; touch-action: manipulation; }
        .board-requirement-check { display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #333; }
        .refine-section { padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #f8f8f8; border: 1px solid #e0e0e0; }
        .refine-section.or-mode { background: #fff8f0; border-color: #ffe4cc; }
        .refine-title { font-size: 14px; font-weight: 600; color: #333; display: block; margin-bottom: 8px; }
        .refine-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
        .mini-btn { padding: 4px 10px; font-size: 11px; background: #fff; border: 1px solid #ccc; border-radius: 6px; color: #666; font-weight: 600; }
        .toggle-switch { display: inline-flex; background: #e0e0e0; border-radius: 6px; padding: 2px; }
        .toggle-option { padding: 4px 10px; font-size: 11px; font-weight: 600; border-radius: 4px; cursor: pointer; color: #666; user-select: none; white-space: nowrap; }
        .toggle-option.active { background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); color: #007AFF; }
        .logic-toggle .toggle-option[data-logic="OR"].active { color: #d67a00; }

        .deck-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .refine-input-wrap { position: relative; }
        .refine-input { width: 100%; height: 40px; padding: 0 8px 0 22px; border: 2px solid #e0e0e0; border-radius: 6px; text-align: center; font-size: 15px; background: white; }
        .refine-input:focus { outline: none; }
        .refine-input.filled { font-weight: bold; }
        .deck-role { position: absolute; left: 2px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; border-radius: 50%; background: #e0e0e0; color: #999; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 3; user-select: none; border: 1px solid #ccc; transition: 0.15s; }
        .deck-role:active { transform: translateY(-50%) scale(0.9); }
        .friend-badge { position: absolute; left: 2px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; border-radius: 50%; background: #6a1b9a; color: white; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; z-index: 3; user-select: none; border: 1px solid #6a1b9a; }

        .refine-input-wrap.role-A .refine-input { border-color: #c62828; background: #fce4ec; }
        .refine-input-wrap.role-B .refine-input { border-color: #1565c0; background: #e3f2fd; }
        .refine-input-wrap.role-C .refine-input { border-color: #2e7d32; background: #e8f5e9; }
        .refine-input-wrap.role-D .refine-input { border-color: #e65100; background: #fff3e0; }
        .refine-input-wrap.role-E .refine-input { border-color: #6a1b9a; background: #f3e5f5; }
        .refine-input-wrap.role-A .deck-role { background: #c62828; color: white; border-color: #c62828; }
        .refine-input-wrap.role-B .deck-role { background: #1565c0; color: white; border-color: #1565c0; }
        .refine-input-wrap.role-C .deck-role { background: #2e7d32; color: white; border-color: #2e7d32; }
        .refine-input-wrap.role-D .deck-role { background: #e65100; color: white; border-color: #e65100; }

        .friend-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #ddd; }
        .friend-label { font-weight: 600; font-size: 14px; color: #6a1b9a; white-space: nowrap; }
        .friend-box { flex: 1; max-width: 250px; }

        .pool-toggle-row { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #ddd; }
        .pool-toggle-row .board-requirement-check { font-size: 13px; }

        .char-autocomplete { display: none; position: absolute; top: calc(100% + 2px); left: 0; min-width: 180px; max-width: 260px; background: white; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); max-height: 200px; overflow-y: auto; z-index: 70; }
        .char-autocomplete.open { display: block; }
        .char-option { padding: 6px 10px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .char-option:last-child { border-bottom: none; }
        .char-option:hover, .char-option.selected { background: #f0f8ff; }
        .char-option .char-name { flex: 1; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .char-option .char-hira { color: #007AFF; font-weight: 600; white-space: nowrap; font-size: 11px; }

        .sort-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 0 5px; }
        .sort-row .sort-label { font-weight: 600; font-size: 14px; color: #333; }
        .text-filter-container { background: #fff; border: 2px solid #eee; border-radius: 8px; padding: 10px 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .text-filter-label { font-weight: 600; font-size: 14px; color: #333; white-space: nowrap; }
        .text-filter-input { flex: 1; border: none; font-size: 16px; padding: 5px; outline: none; color: #333; background: transparent; }
        .optimize-section { background: #f0fff0; border: 1px solid #cce4cc; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .optimize-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .optimize-title { font-weight: 600; color: #28a745; font-size: 15px; }
        .optimize-item { background: white; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-left: 3px solid #28a745; }
        .optimize-item .board-layout { display: flex; justify-content: center; gap: 3px; margin-bottom: 5px; flex-wrap: nowrap; }
        .optimize-item .board-layout .char-cell { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 42px; border-radius: 6px; position: relative; border: 2px solid transparent; line-height: 1; text-align: center; flex-shrink: 0; }
        .optimize-item .board-layout .char-cell .char-text { font-size: 22px; }
        .optimize-item .board-layout .char-cell .char-text.small-kana { font-size: 16px; }
        .optimize-item .board-layout .char-cell.box-A { background: #fce4ec; color: #c62828; border-color: #c62828; }
        .optimize-item .board-layout .char-cell.box-B { background: #e3f2fd; color: #1565c0; border-color: #1565c0; }
        .optimize-item .board-layout .char-cell.box-C { background: #e8f5e9; color: #2e7d32; border-color: #2e7d32; }
        .optimize-item .board-layout .char-cell.box-D { background: #fff3e0; color: #e65100; border-color: #e65100; }
        .optimize-item .board-layout .char-cell.box-E { background: #f3e5f5; color: #6a1b9a; border-color: #6a1b9a; }
        .optimize-item .board-layout .char-cell.existing { background: #f5f5f5; color: #999; border-color: #ddd; }
        .optimize-item .board-layout .char-cell.dead { border-style: dotted !important; }
        .optimize-item .board-layout .char-cell .box-badge { position: absolute; top: -7px; right: -7px; width: 16px; height: 16px; border-radius: 50%; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: white; line-height: 1; }
        .optimize-item .board-layout .char-cell.box-A .box-badge { background: #c62828; }
        .optimize-item .board-layout .char-cell.box-B .box-badge { background: #1565c0; }
        .optimize-item .board-layout .char-cell.box-C .box-badge { background: #2e7d32; }
        .optimize-item .board-layout .char-cell.box-D .box-badge { background: #e65100; }
        .optimize-item .board-layout .char-cell.box-E .box-badge { background: #6a1b9a; }
        .optimize-item .board-details { font-size: 12px; color: #666; text-align: center; }
        .optimize-item .board-words-display { font-size: 11px; color: #28a745; text-align: center; margin-top: 3px; line-height: 1.4; }
        .optimize-loading { text-align: center; color: #28a745; padding: 15px; font-size: 13px; }
        .optimize-stop-btn { background: #dc3545; margin-left: 8px; }
        .optimize-legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; font-size: 10px; }
        .optimize-legend span { display: inline-flex; align-items: center; gap: 3px; }
        .optimize-legend .legend-box { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 2px solid; }
        .results { margin-top: 10px; }
        .result-count { font-size: 15px; color: #666; margin-bottom: 15px; padding-left: 10px; }
        .result-item { padding: 16px; background: #fafafa; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #ddd; cursor: pointer; }
        .result-item.refine-match { border-left-color: #007AFF; background: #f2f8ff; }
        .or-mode .result-item.refine-match { border-left-color: #d67a00; background: #fffcf5; }
        .result-word { font-size: 20px; font-weight: 600; margin-bottom: 6px; color: #111; display:flex; justify-content: space-between; align-items: center;}
        .result-info { color: #666; font-size: 14px; }
        .result-themes { color: #007AFF; font-size: 13px; margin-top: 4px; }
        .no-results { text-align: center; padding: 40px 20px; color: #999; font-size: 16px; }
        .mini-grid { display: grid; grid-template-columns: repeat(7, 18px); gap: 2px; flex-shrink: 0; }
        .mini-box { width: 18px; height: 18px; border: 1px solid #ddd; border-radius: 2px; font-size: 10px; display: flex; align-items: center; justify-content: center; background: #fff; color: #ccc; }
        .mini-box.matched { background: #007AFF; border-color: #007AFF; color: white; }
        .mini-box.overlap { background: #e0efff; border-color: #007AFF; color: #007AFF; }
        .words-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: white; border-radius: 12px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 100; max-width: 400px; width: 90%; max-height: 70vh; overflow-y: auto; }
        .words-popup h3 { font-size: 16px; margin-bottom: 12px; color: #333; text-align: center; }
        .words-popup .word-entry { padding: 8px 10px; margin: 4px 0; background: #f8f9fa; border-radius: 6px; font-size: 14px; }
        .words-popup .word-entry .word-main { display: flex; justify-content: space-between; align-items: center; }
        .words-popup .word-entry .pos-range { font-size: 11px; color: #999; }
        .words-popup .word-entry .word-text { font-weight: 600; }
        .words-popup .word-entry.long-word .word-text { color: #28a745; }
        .words-popup .word-entry.short-word .word-text { color: #ff9800; }
        .words-popup .word-entry .word-themes { font-size: 10px; color: #666; margin-top: 3px; }
        .words-popup .close-btn { display: block; margin: 15px auto 0; padding: 8px 24px; background: #007AFF; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 99; }
        @media (max-width: 600px) {
            .deck-grid { grid-template-columns: repeat(3, 1fr); }
            .optimize-item .board-layout { gap: 2px; }
            .optimize-item .board-layout .char-cell { width: 30px; height: 34px; }
            .optimize-item .board-layout .char-cell .char-text { font-size: 17px; }
            .optimize-item .board-layout .char-cell .char-text.small-kana { font-size: 13px; }
            .optimize-item .board-layout .char-cell .box-badge { top: -5px; right: -5px; width: 12px; height: 12px; font-size: 7px; }
            .theme-dropdown { min-width: 250px; max-width: 90vw; }
        }
        @media (max-width: 400px) {
            .deck-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .refine-input { font-size: 13px; height: 36px; }
            .optimize-item .board-layout { gap: 1px; }
            .optimize-item .board-layout .char-cell { width: 26px; height: 30px; }
            .optimize-item .board-layout .char-cell .char-text { font-size: 15px; }
            .optimize-item .board-layout .char-cell .char-text.small-kana { font-size: 11px; }
            .optimize-item .board-layout .char-cell .box-badge { top: -4px; right: -4px; width: 10px; height: 10px; font-size: 6px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container"><h1>Kotodaman Board Solver</h1><div class="loading" id="loadingMsg">Loading dictionary...</div><div id="mainContent" style="display:none;">
            <div class="input-section">
            <div class="pos-filter-container" id="boardContainer"><div data-index="0"><input type="text" class="pos-input" data-index="0" autocomplete="off"><span class="cell-toggle board" data-index="0">B</span></div><div data-index="1"><input type="text" class="pos-input" data-index="1" autocomplete="off"><span class="cell-toggle board" data-index="1">B</span></div><div data-index="2"><input type="text" class="pos-input" data-index="2" autocomplete="off"><span class="cell-toggle board" data-index="2">B</span></div><div data-index="3"><input type="text" class="pos-input" data-index="3" autocomplete="off"><span class="cell-toggle board" data-index="3">B</span></div><div data-index="4"><input type="text" class="pos-input" data-index="4" autocomplete="off"><span class="cell-toggle board" data-index="4">B</span></div><div data-index="5"><input type="text" class="pos-input" data-index="5" autocomplete="off"><span class="cell-toggle board" data-index="5">B</span></div><div data-index="6"><input type="text" class="pos-input" data-index="6" autocomplete="off"><span class="cell-toggle board" data-index="6">B</span></div></div>
            <div class="pos-clear-container" id="posClearContainer"><button class="pos-clear" data-index="0">×</button><button class="pos-clear" data-index="1">×</button><button class="pos-clear" data-index="2">×</button><button class="pos-clear" data-index="3">×</button><button class="pos-clear" data-index="4">×</button><button class="pos-clear" data-index="5">×</button><button class="pos-clear" data-index="6">×</button></div>
            <div class="pos-labels-container"><div class="pos-label">1</div><div class="pos-label">2</div><div class="pos-label">3</div><div class="pos-label">4</div><div class="pos-label">5</div><div class="pos-label">6</div><div class="pos-label">7</div></div>
            <div class="action-row"><label class="board-requirement-check"><input type="checkbox" id="requireAllBoard"> Must use all board chars</label><button id="clearBtn" type="button">Reset Grid</button></div></div>
            
            <div class="optimize-section" id="optimizeSection" style="display:block;"><div class="optimize-header"><span class="optimize-title">🎯 Board Optimization</span><div><button id="optimizeBtn" class="primary" type="button">Find Best Board</button><button id="stopOptimizeBtn" class="optimize-stop-btn" type="button" style="display:none;">Stop</button></div></div><div id="optimizeResults" class="optimize-results"></div></div>
            
            <div class="filters">
                <div class="filter-row"><span class="filter-label">Length:</span><div class="radio-group"><label><input type="checkbox" name="chars" value="2"><span>2</span></label><label><input type="checkbox" name="chars" value="3"><span>3</span></label><label><input type="checkbox" name="chars" value="4"><span>4</span></label><label><input type="checkbox" name="chars" value="5"><span>5</span></label><label><input type="checkbox" name="chars" value="6"><span>6</span></label><label><input type="checkbox" name="chars" value="7"><span>7</span></label></div></div>
                <div class="filter-row"><span class="filter-label">Theme:</span>
                    <div class="theme-checklist-container" id="themeChecklistContainer">
                        <button class="theme-toggle-btn" id="themeToggleBtn"><span>Select Themes</span><span class="selected-count" id="themeCount">0</span></button>
                        <div class="theme-dropdown" id="themeDropdown">
                            <input type="text" class="theme-search-input" id="themeSearchInput" placeholder="Search themes...">
                            <div id="themeOptionsList"></div>
                            <div class="theme-actions"><button id="themeSelectAll">Select All</button><button id="themeClearAll">Clear All</button></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="refine-section" id="refineSection"><span class="refine-title">Deck:</span><div class="refine-controls"><button id="clearRefineBtn" class="mini-btn" type="button">Clear All</button><div class="toggle-switch logic-toggle"><div class="toggle-option" data-logic="OR">Any (OR)</div><div class="toggle-option active" data-logic="AND">All (AND)</div></div></div><div class="deck-grid" id="deckGrid"></div>
            <div class="friend-row"><span class="friend-label">Friend (E):</span><div class="refine-input-wrap role-E friend-box"><span class="friend-badge">E</span><input type="text" class="refine-input" id="friendInput" autocomplete="off"></div></div>
            <div class="pool-toggle-row"><label class="board-requirement-check" title="'Only use deck' checks that non-board characters come from the deck pool. Board characters count as already available."><input type="checkbox" id="useAllDeckBoxes" checked> Only use deck</label></div>
            </div>

function cg(w){const m=new Map();for(const x of w){const f=new Set();for(let s=0;s<x.word.length;s++)for(let e=s+2;e<=x.word.length;e++)if(ws.has(x.word.substring(s,e)))f.add(x.word.substring(s,e));m.set(x.word,f.size);}return m;}
function cp(w,o,b,f){const k=`${w}|${o}|${b.join(',')}|${f.join(',')}`;if(cc.has(k))return cc.get(k);let c=0;for(let s=0;s<w.length;s++)for(let e=s+2;e<=w.length;e++){let h=false;for(let i=s;i<e&&!h;i++){const bi=o+i;if(f[bi]||!b[bi])h=true;}if(h&&ws.has(w.substring(s,e)))c++;}cc.set(k,c);return c;}
function ca(bs){if(bs.length!==7)return 0;let c=0;for(let s=0;s<7;s++)for(let e=s+2;e<=7;e++)if(ws.has(bs.substring(s,e)))c++;return c;}

function gd(){const s=[["あい","",1,["愛"],["気持ち","鳥"]],["あお","",1,["青"],["色"]],["うみ","",1,["海"],["自然","地名"]],["うそう","",1,["雨窓"],["建物","自然"]],["しょうそう","",4,["焦燥"],["気持ち"]],["うそうかい","",5,["有象海"],[]],["さいし","",3,["祭祀"],["行事"]],["さいしょ","",4,["最初"],["順番"]],["さいしょう","",5,["最小"],["順番"]],["しょうさ","",4,["勝差"],["勝負"]],["しょうさい","",5,["詳細"],[]],["さんしょう","",5,["参照"],[]],["あした","",3,["明日"],["時間"]],["あいさつ","",4,["挨拶"],["日常"]],["こう","",2,["甲"],["囲碁・将棋・麻雀","単位・通貨","地名","鳥","ボードゲーム","いきもの","動詞"]],["こうこう","",4,["高校"],["学校"]],["こうこうしゃ","",5,["高校社"],["学校"]],["こうそ","",3,["酵素"],["理科"]],["たいいく","",4,["体育"],["学校"]],["たいしょう","",4,["大正"],["コラボ","コラボクイズ","元号","地名","日本史"]],["あとこうしゃく","",7,["後講釈"],[]],["こうかい","",3,["公海"],["地名"]],["こうかん","",3,["交換"],["動詞"]],["しょうかい","",4,["紹介"],["動詞"]],["しょうかん","",4,["召喚"],["動詞"]],["しょうこう","",4,["将校"],["身分"]]];return s.map(e=>({word:e[0],chars:e[1]||e[0],displays:e[3],themes:e[4]||[]}));}
function ld(){return fetch('https://raw.githubusercontent.com/DragonicBear/KotoDict/refs/heads/main/words.json').then(r=>{if(!r.ok)throw Error('e');return r.json();}).then(data=>{

}).catch(()=>{d=gd();const tempMap=new Map();d.forEach(w=>{if(tempMap.has(w.word)){tempMap.set(w.word,[...new Set([...tempMap.get(w.word),...w.themes])]);}else{tempMap.set(w.word,[...w.themes]);}});wordThemeMap=tempMap;ws=new Set(d.map(w=>w.word));const cm=cg(d);for(const w of d)w.combo=cm.get(w.word)||0;document.getElementById('loadingMsg').textContent='⚠ Sample dictionary loaded.';return new Promise(r=>setTimeout(r,300));});}
function buildThemeSubwordMap(){if(themeSubwordMapBuilt)return;themeSubwordMapBuilt=true;themeSubwordMap.clear();const themeToWords=new Map();for(const w of d){if(w.themes&&Array.isArray(w.themes)){for(const t of w.themes){if(!themeToWords.has(t))themeToWords.set(t,new Set());themeToWords.get(t).add(w.word);}}}for(const [theme,directWords] of themeToWords){const resultSet=new Set();for(const dw of directWords){resultSet.add(dw);for(const w of d){if(w.word!==dw&&w.word.includes(dw)){resultSet.add(w.word);}}}themeSubwordMap.set(theme,resultSet);}}

function buildDeckGrid(){
    const grid = document.getElementById('deckGrid');
    grid.innerHTML = '';

        const wrap = document.createElement('div');
        wrap.className = 'refine-input-wrap';

        grid.appendChild(wrap);
    }
    boxRoles = new Array(NUM_DECK_BOXES).fill('');
    for (let i = 0; i < 4; i++) {
        boxRoles[i] = String.fromCharCode(65 + i);
    }
    for (let i = 0; i < NUM_DECK_BOXES; i++) updateRoleBadge(i);
}

function updateRoleBadge(idx){
    const badge = document.querySelector(`.deck-role[data-idx="${idx}"]`);
    if (!badge) return;
    const wrap = badge.parentElement;
    const role = boxRoles[idx];
    badge.textContent = role || '-';
    wrap.classList.remove('role-A','role-B','role-C','role-D');
    if (role === 'A') wrap.classList.add('role-A');
    else if (role === 'B') wrap.classList.add('role-B');
    else if (role === 'C') wrap.classList.add('role-C');
    else if (role === 'D') wrap.classList.add('role-D');
}

function cycleRole(idx){
    const current = boxRoles[idx];
    const letters = ['A','B','C','D'];
    const startIdx = current ? letters.indexOf(current) + 1 : 0;

    let next = '';
    for (let i = startIdx; i < letters.length; i++) {
        const candidate = letters[i];
        const takenByOther = boxRoles.some((r, j) => j !== idx && r === candidate);
        if (!takenByOther) {
            next = candidate;
            break;
        }
    }
    boxRoles[idx] = next;
    updateRoleBadge(idx);
    cc.clear();
    ps();
}

function getAssignedBoxes(){
    const result = [];
    for (let letterIdx = 0; letterIdx < 4; letterIdx++) {
        const letter = String.fromCharCode(65 + letterIdx);
        const boxIdx = boxRoles.indexOf(letter);
        if (boxIdx >= 0 && ri[boxIdx] && ri[boxIdx].value.trim()) {
            result.push({
                letter: letter,
                letterIndex: letterIdx,
                chars: ri[boxIdx].value.trim().split('')
            });
        }
    }
    if (friendInput && friendInput.value.trim()) {
        result.push({
            letter: 'E',
            letterIndex: 4,
            chars: friendInput.value.trim().split('')
        });
    }
    return result;
}

function gc(){
    return getAssignedBoxes().map(b => b.chars);
}

function getDeckPool(){
    const pool = new Map();
    for (const inp of ri) {
        const v = inp.value.trim();
        if (!v) continue;
        for (const ch of v) pool.set(ch, (pool.get(ch) || 0) + 1);
    }
    if (friendInput && friendInput.value.trim()) {
        for (const ch of friendInput.value.trim()) {
            pool.set(ch, (pool.get(ch) || 0) + 1);
        }
    }
    return pool;
}

function isFormableFromPool(word, pool){
    const need = new Map();
    for (const ch of word) {
        const n = (need.get(ch) || 0) + 1;
        if (n > (pool.get(ch) || 0)) return false;
        need.set(ch, n);
    }
    return true;
}

function getAllThemes(){const themes=new Set();const excludeKeywords=['イベント','コラボ','コラボレーション','collab','event','イベ','期間限定','フェス','fes','復刻','ガチャ','キャンペーン','CP','限定','コラボ記念','周年'];for(const w of d){if(w.themes&&Array.isArray(w.themes)){for(const t of w.themes){const lower=t.toLowerCase();if(!excludeKeywords.some(kw=>lower.includes(kw.toLowerCase()))){themes.add(t);}}}}return [...themes].sort((a,b)=>a.localeCompare(b));}
function populateThemeChecklist(){const themes=getAllThemes();const themeCounts=new Map();for(const w of d){if(w.themes&&Array.isArray(w.themes)){for(const t of w.themes){themeCounts.set(t,(themeCounts.get(t)||0)+1);}}}themeOptionsList.innerHTML=themes.map(t=>{const count=themeCounts.get(t)||0;return`<label class="theme-option"><input type="checkbox" value="${t}" class="theme-checkbox"><span>${t}</span><span class="theme-count">${count}</span></label>`;}).join('');document.querySelectorAll('.theme-checkbox').forEach(cb=>{cb.addEventListener('change',()=>{if(cb.checked){selectedThemes.add(cb.value);}else{selectedThemes.delete(cb.value);}updateThemeUI();ps();});});}
function filterThemeOptions(query){const lower=query.toLowerCase();document.querySelectorAll('.theme-option').forEach(opt=>{const text=opt.textContent.toLowerCase();opt.style.display=text.includes(lower)?'flex':'none';});}
function updateThemeUI(){document.querySelectorAll('.theme-checkbox').forEach(cb=>{cb.checked=selectedThemes.has(cb.value);});themeCount.textContent=selectedThemes.size;if(selectedThemes.size>0){themeCount.classList.add('has-selection');themeToggleBtn.querySelector('span:first-child').textContent='Themes Selected';}else{themeCount.classList.remove('has-selection');themeToggleBtn.querySelector('span:first-child').textContent='Select Themes';}}

function gm(ca2,ci2,boxes,lo,iv,o,excludeSet){
    const ac=[],ai=[];
    for(let i=0;i<ca2.length;i++){
        if(excludeSet && excludeSet.has(ci2[i])) continue;
        const bp=o===-1?-1:o+ci2[i];
        if(bp===-1||!iv[bp]){ac.push(ca2[i]);ai.push(ci2[i]);}
    }
    const boxMap=new Map();
    if(lo==='OR'){
        const m=new Set();
        boxes.forEach(box=>{
            const c=box.chars;
            for(let i=0;i<ac.length;i++){
                if(c.includes(ac[i])&&!boxMap.has(ai[i])){
                    m.add(ai[i]);
                    boxMap.set(ai[i],box.letterIndex);
                }
            }
        });
        return{matched:m,count:m.size>0?1:0,boxMap};
    }else{
        let p=[...ac],pi2=[...ai],m=new Set(),count=0;
        for(const box of boxes){
            if(count >= 4) break;
            const c=box.chars;
            const idx=p.findIndex(ch=>c.includes(ch));
            if(idx!==-1){
                m.add(pi2[idx]);
                boxMap.set(pi2[idx],box.letterIndex);
                p.splice(idx,1);
                pi2.splice(idx,1);
                count++;
            }
        }
        return{matched:m,count,boxMap};
    }
}

function setupCharAutocomplete(){

        const closeDropdown=()=>{dropdown.classList.remove('open');selectedIndex=-1;};
        const updateDropdown=()=>{
            const query=input.value.trim().toLowerCase();
            if(!query||characters.length===0){closeDropdown();return;}
            filteredChars=characters.filter(c=>c.name.toLowerCase().includes(query)).slice(0,15);
            if(filteredChars.length===0){closeDropdown();return;}
            if(selectedIndex>=filteredChars.length)selectedIndex=filteredChars.length-1;
            dropdown.innerHTML=filteredChars.map((c,i)=>`<div class="char-option${i===selectedIndex?' selected':''}" data-index="${i}"><span class="char-name">${c.name}</span><span class="char-hira">${c.hiragana}</span></div>`).join('');

            else if(e.key==='Escape'){closeDropdown();}

    });
}

function ps(){
    const rc=document.getElementById('resultCount'),rl=document.getElementById('resultList');
    const so2=ss.value;const cf=Array.from(document.querySelectorAll('input[name="chars"]:checked')).map(c=>parseInt(c.value));
    const tf=ts.value.trim(),rabv=rab.checked;
    const uabv=!!(uad&&uad.checked);
    const iv=pi.map(i=>i.value.trim()),hapf=iv.some(v=>v.length>0);
    const rfcBoxes=getAssignedBoxes();
    const rfc=rfcBoxes.map(b=>b.chars);
    const maxBoxes=Math.min(rfc.length,4);
    const hrf=rfc.length>0;let results=d;
    let poolMap=null;
    if(uabv){const p=getDeckPool();if(p.size>0)poolMap=p;}
    if(selectedThemes.size>0){const selectedArr=[...selectedThemes];results=results.filter(w=>wordMatchesThemes(w.word,selectedArr));}
    if(cf.length>0){const fs=new Set(cf);results=results.filter(w=>fs.has(w.word.length));}

    let patternFixedPositions = null;
    if(!hapf && tf.includes('-') && tf.length > 0 && tf.length <= 7){
        patternFixedPositions = new Set();
        for(let i=0;i<tf.length;i++){
            if(tf[i] !== '-') patternFixedPositions.add(i);
        }
    }

    // CHANGED: pattern pre-filter now only checks shape + fixed chars.
    // The pool/board availability is enforced inside the offset loop below.
    if(tf.length>0){
        const hasWildcard=tf.includes('-');
        if(!hasWildcard){results=results.filter(w=>w.word.includes(tf));}
        else{
            const pl=tf.length;
            const nonWC=[];
            for(let i=0;i<pl;i++){
                if(tf[i]!=='-')nonWC.push({pos:i,ch:tf[i]});
            }
            results=results.filter(w=>{
                if(w.word.length!==pl)return false;
                for(const n of nonWC){if(w.word[n.pos]!==n.ch)return false;}
                return true;
            });
        }
    }

    let wm=new Map(),vbw=[];const rbi=(rabv&&hapf)?iv.reduce((a,v,i)=>{if(v.length>0)a.push(i);return a;},[]):[];
    for(const w of results){
        const len=w.word.length;
        if(hapf&&len>7)continue;
        let vo=[];
        if(hapf){
            // CHANGED: board-match + pool-availability checked per offset.
            for(let s=0;s<=7-len;s++){
                let fits=true;
                const need=new Map();
                for(let i=0;i<len;i++){
                    if(iv[s+i]){
                        if(!iv[s+i].includes(w.word[i])){fits=false;break;}
                    } else if(poolMap){
                        need.set(w.word[i],(need.get(w.word[i])||0)+1);
                    }
                }
                if(fits&&poolMap){
                    for(const [ch,n] of need){
                        if((poolMap.get(ch)||0)<n){fits=false;break;}
                    }
                }
                if(fits&&rabv&&rbi.length>0){
                    const we=s+len;
                    if(!rbi.every(idx=>idx>=s&&idx<we))fits=false;
                }
                if(fits)vo.push(s);
            }
            if(vo.length===0)continue;
        } else {
            // CHANGED: board-empty case.
            if(poolMap){
                if(tf.includes('-')){
                    // Wildcard: fixed pattern chars treated as board chars (free),
                    // wildcard positions must come from the deck pool.
                    const need=new Map();
                    let ok=true;
                    for(let i=0;i<len;i++){
                        if(patternFixedPositions && patternFixedPositions.has(i))continue;
                        need.set(w.word[i],(need.get(w.word[i])||0)+1);
                    }
                    for(const [ch,n] of need){
                        if((poolMap.get(ch)||0)<n){ok=false;break;}
                    }
                    if(!ok)continue;
                } else {
                    if(!isFormableFromPool(w.word,poolMap))continue;
                }
            }
            vo=[-1];
        }
        let ac2=0;if(hapf){for(const o of vo){const c2=cp(w.word,o,iv,ff);if(c2>ac2)ac2=c2;}}else ac2=w.combo||0;
        let bo=vo[0],irm=false,mi=new Set(),rmc=0,bmap=new Map();
        if(hrf){let bestC=cl==='AND'?-1:0;for(const o of vo){const ch=w.word.split('');let cts=[],ci2=[];if(o===-1){cts=[...ch];ci2=ch.map((_,i)=>i);}else{for(let i=0;i<ch.length;i++){if(!iv[o+i]){cts.push(ch[i]);ci2.push(i);}}}const dx=gm(cts,ci2,rfcBoxes,cl,iv,o,patternFixedPositions);if(cl==='OR'){if(dx.matched.size>0){bo=o;mi=dx.matched;rmc=dx.count;irm=true;bmap=dx.boxMap;break;}}else{if(dx.count>bestC){bestC=dx.count;bo=o;mi=dx.matched;rmc=dx.count;irm=(dx.count>=maxBoxes);bmap=dx.boxMap;}}}if(cl==='OR'&&!irm)continue;if(cl==='AND'&&rmc===0)continue;}
        wm.set(w.word,{validOffsets:[bo],isRefineMatch:irm,refineMatchedCount:rmc,matchedIndices:mi,combo:ac2,totalConstraints:maxBoxes,boxMap:bmap});vbw.push(w);}
    vbw.sort((a,b)=>{
        const ma=wm.get(a.word),mb=wm.get(b.word);
        if(hrf){
            if(ma.isRefineMatch!==mb.isRefineMatch)return ma.isRefineMatch?-1:1;
            if(!uabv && cl==='AND' && ma.refineMatchedCount!==mb.refineMatchedCount){
                return mb.refineMatchedCount-ma.refineMatchedCount;
            }
        }
        switch(so2){case'asc':return a.word.length-b.word.length;case'desc':return b.word.length-a.word.length;case'combo-asc':return ma.combo-mb.combo;case'combo-desc':return mb.combo-ma.combo;default:return 0;}
    });
    const mr=300,dr=vbw.slice(0,mr);
    if(!hapf&&!hrf&&!poolMap&&cf.length===0&&tf.length===0&&selectedThemes.size===0){rc.textContent=`Waiting for input... (${d.length} words)`;rl.innerHTML='';return;}
    if(dr.length===0){rc.textContent="No matches found";rl.innerHTML='<div class="no-results">No words match your criteria</div>';}
    else{
        rc.textContent=`Found ${vbw.length} words${vbw.length>mr?` (Showing first ${mr})`:''}`;
        const boxColors=['#c62828','#1565c0','#2e7d32','#e65100','#6a1b9a'];
        const boxBgs=['#fce4ec','#e3f2fd','#e8f5e9','#fff3e0','#f3e5f5'];
        const hp=[];
        for(const w of dr){
            const m=wm.get(w.word),dt=w.displays[0]||w.word;
            const tt=w.themes&&w.themes.length>0?`<div class="result-themes">Theme: ${w.themes.join(', ')}</div>`:'';
            const po=m.validOffsets[0],ch=w.word.split('');
            let gi=new Set();
            if(po!==-1){for(let i=0;i<ch.length;i++){if(iv[po+i])gi.add(i);}}
            const hwh=ch.map((c,i)=>{
                if(gi.has(i) || (patternFixedPositions && patternFixedPositions.has(i))){
                    return`<span style="color:#999;background:#f0f0f0;padding:0 3px;border-radius:3px;">${c}</span>`;
                }
                const bx=(m.boxMap&&m.boxMap.has(i))?m.boxMap.get(i):undefined;
                if(bx!==undefined){
                    const ci2 = bx % 5;
                    return`<span style="color:${boxColors[ci2]||'#333'};background:${boxBgs[ci2]||'#f5f5f5'};padding:0 3px;border-radius:3px;font-weight:bold;">${c}</span>`;
                }
                return c;
            }).join('');
            let gh='';
            if(po!==-1){
                let p=['<div class="mini-grid">'];
                for(let b=0;b<7;b++){
                    let ct='',cl2='mini-box',st='';
                    if(b>=po&&b<po+w.word.length){
                        ct=w.word[b-po];
                        if(iv[b]){cl2+=' matched';}
                        else{
                            const bx=(m.boxMap&&m.boxMap.has(b-po))?m.boxMap.get(b-po):undefined;
                            if(bx!==undefined){const ci2 = bx % 5; st=`background:${boxBgs[ci2]};border-color:${boxColors[ci2]};color:${boxColors[ci2]};`;}
                            else{cl2+=' overlap';}
                        }
                    }
                    p.push(`<div class="${cl2}" style="${st}">${ct}</div>`);
                }
                p.push('</div>');
                gh=p.join('');
            }
            const ic='result-item'+(m.isRefineMatch?' refine-match':''),cs=hapf?`${m.combo} (adj)`:`${m.combo}`;
            let mi2='';if(hrf&&cl==='AND')mi2=` | Deck: ${m.refineMatchedCount}/${m.totalConstraints||maxBoxes}`;
            const boardForPopup=(()=>{if(po===-1)return w.word;const b=[...iv];for(let i=0;i<w.word.length;i++)b[po+i]=w.word[i];return b.join('');})();
            hp.push(`<div class="${ic}" data-board="${boardForPopup}"><div class="result-word"><span>${dt} <span style="font-weight:normal;font-size:0.8em;color:#666;">(${hwh})</span></span>${gh}</div><div class="result-info">${w.word.length} chars · Combo: ${cs}${mi2}</div>${tt}</div>`);
        }
        rl.innerHTML=hp.join('');
        document.querySelectorAll('#resultList .result-item').forEach(item=>{item.addEventListener('click',()=>{const boardStr=item.dataset.board;if(boardStr)swp(boardStr);});});
    }
}
function swp(bs){const words=fw(bs);const overlay=document.createElement('div');overlay.className='overlay';overlay.id='wordsOverlay';const popup=document.createElement('div');popup.className='words-popup';const allThemes=new Set();let html=`<h3>📖 Words Found (${words.length})</h3>`;for(const w of words){const themes=wordThemeMap.get(w.word)||[];themes.forEach(t=>allThemes.add(t));const themeStr=themes.length?`<div class="word-themes">${themes.join(', ')}</div>`:'';html+=`<div class="word-entry ${w.word.length>=4?'long-word':'short-word'}"><div class="word-main"><span class="word-text">${w.word}</span><span class="pos-range">Pos ${w.start+1}-${w.end+1} (${w.word.length}L)</span></div>${themeStr}</div>`;}if(allThemes.size>0){html+=`<div style="margin-top:10px;font-size:11px;color:#666;">All themes: ${[...allThemes].sort().join(', ')}</div>`;}html+=`<button class="close-btn" id="closeWordsPopup">Close</button>`;popup.innerHTML=html;document.body.appendChild(overlay);document.body.appendChild(popup);overlay.addEventListener('click',()=>{overlay.remove();popup.remove();});document.getElementById('closeWordsPopup').addEventListener('click',()=>{overlay.remove();popup.remove();});}
function glp(bs){const pos=new Set();const words=fw(bs);for(const w of words){if(w.word.length>=4){for(let i=w.start;i<=w.end;i++)pos.add(i);}}return pos;}
function comb(arr,k){if(k===0)return[[]];if(k>arr.length)return[];const r=[];function f(s,c){if(c.length===k){r.push([...c]);return;}for(let i=s;i<arr.length;i++){c.push(arr[i]);f(i+1,c);c.pop();}}f(0,[]);return r;}
function perm(arr){if(arr.length<=1)return[arr];const r=[];for(let i=0;i<arr.length;i++){const rest=[...arr.slice(0,i),...arr.slice(i+1)];for(const p of perm(rest))r.push([arr[i],...p]);}return r;}
function cart(arrays){if(arrays.length===0)return[[]];return arrays.reduce((a,b)=>a.flatMap(x=>b.map(y=>[...x,y])),[[]]);}

function countBoxesFromAssignments(assignments){
    const roles = new Set();
    for(const a of assignments){
        if(a.boxIdx >= 0 && a.boxIdx <= 4) roles.add(a.boxIdx);
    }
    return roles.size;
}
function countBoxesUsed(r){
    if(!r.assignments || !r.assignments.length) return 0;
    return countBoxesFromAssignments(r.assignments);
}
function countDeadCells(board){
    const lwp = glp(board);
    let c = 0;
    for(let i=0;i<board.length;i++) if(!lwp.has(i)) c++;
    return c;
}
function getMaxWordLength(board){
    const words = fw(board);
    if(!words.length) return 0;
    let m = 0;
    for(const w of words) if(w.word.length > m) m = w.word.length;
    return m;
}

function so2(){
    if(io)return;io=true;so=false;ob.style.display='none';stb.style.display='inline-block';
    const curB=pi.map(i=>i.value.trim());
    const es=[];for(let i=0;i<7;i++)if(!curB[i])es.push(i);
    const k=es.length;
    if(k===0){fo([{board:curB.join(''),combo:ca(curB.join('')),assignments:[]}]);return;}
    const results=[];

    const uabv = !!(uad && uad.checked);

    let sources;
    if(uabv){
        sources = [];
        const slotRole = new Map();
        for(let letterIdx=0; letterIdx<4; letterIdx++){
            const letter = String.fromCharCode(65+letterIdx);
            const slotIdx = boxRoles.indexOf(letter);
            if(slotIdx >= 0 && ri[slotIdx] && ri[slotIdx].value.trim()){
                slotRole.set(slotIdx, letterIdx);
            }
        }
        for(let i=0;i<ri.length;i++){
            const v = ri[i].value.trim();
            if(v){
                sources.push({chars: v.split(''), letterIndex: slotRole.has(i) ? slotRole.get(i) : -1});
            }
        }
        if(friendInput && friendInput.value.trim()){
            sources.push({chars: friendInput.value.trim().split(''), letterIndex: 4});
        }
    } else {
        sources = getAssignedBoxes().map(b=>({chars: b.chars, letterIndex: b.letterIndex}));
    }

    const pattern=curB.map(c=>c?c:'-').join('');

    if(sources.length===0){
        const matchingWords=d.filter(w=>{if(w.word.length!==7)return false;for(let i=0;i<7;i++){if(pattern[i]!=='-'&&pattern[i]!==w.word[i])return false;}return true;}).sort((a,b)=>(b.combo||0)-(a.combo||0));
        or2.innerHTML=`<div class="optimize-loading">🔍 Found ${matchingWords.length} matching words...</div>`;
        setTimeout(()=>{if(matchingWords.length>0){for(const w of matchingWords.slice(0,20)){results.push({board:w.word,combo:ca(w.word),assignments:[]});}}finalizeResults(results,curB,es,sources);},10);
        return;
    }

    or2.innerHTML=`<div class="optimize-loading">🔍 Testing ${sources.length} source${sources.length>1?'s':''}...</div>`;

    setTimeout(()=>{
        const numToUse = Math.min(sources.length, es.length);
        const avgChars = sources.reduce((s,src)=>s+src.chars.length,0)/sources.length;
        let estimate = 1;
        for(let i=0;i<numToUse;i++) estimate *= (sources.length - i) * avgChars;

        if(estimate <= 100000){
            const seen = new Set();
            const assignments = [];
            const used = new Set();
            function recurse(slotIdx){
                if(so) return;
                if(slotIdx === numToUse){
                    const board = [...curB];
                    const assigns = [];
                    for(const a of assignments){
                        board[a.pos] = a.char;
                        assigns.push({pos: a.pos, char: a.char, boxIdx: a.boxIdx});
                    }
                    for(let i=0;i<7;i++) if(!board[i]) board[i] = '・';
                    const bs = board.join('');
                    if(!seen.has(bs)){ seen.add(bs); results.push({board: bs, combo: ca(bs), assignments: assigns}); }
                    return;
                }
                const pos = es[slotIdx];
                for(let s=0;s<sources.length;s++){
                    if(used.has(s)) continue;
                    const src = sources[s];
                    for(const ch of src.chars){
                        used.add(s);
                        assignments.push({pos, char: ch, boxIdx: src.letterIndex});
                        recurse(slotIdx + 1);
                        assignments.pop();
                        used.delete(s);
                    }
                }
            }
            recurse(0);
        } else {
            const BEAM_WIDTH = 2500;
            let beam = [{ board: [...curB], assignments: [], used: new Set() }];
            for(let slotIdx = 0; slotIdx < numToUse; slotIdx++){
                if(so) break;
                const pos = es[slotIdx];
                const nextMap = new Map();
                for(const state of beam){
                    for(let s=0; s<sources.length; s++){
                        if(state.used.has(s)) continue;
                        const src = sources[s];
                        for(const ch of src.chars){
                            const nb = [...state.board];
                            nb[pos] = ch;
                            const key = nb.join('|');
                            const na = [...state.assignments, {pos, char: ch, boxIdx: src.letterIndex}];
                            const newCount = countBoxesFromAssignments(na);
                            const existing = nextMap.get(key);
                            if(existing && existing.boxCount >= newCount) continue;
                            const nu = new Set(state.used); nu.add(s);
                            nextMap.set(key, { board: nb, assignments: na, used: nu, boxCount: newCount });
                        }
                    }
                }
                let arr = [...nextMap.values()];
                for(const st of arr){
                    const b = [...st.board];
                    for(let i=0;i<7;i++) if(!b[i]) b[i]='・';
                    st.partialCombo = ca(b.join(''));
                }
                arr.sort((a,b)=>{
                    if(b.partialCombo !== a.partialCombo) return b.partialCombo - a.partialCombo;
                    return b.boxCount - a.boxCount;
                });
                beam = arr.slice(0, BEAM_WIDTH);
            }
            const seen = new Set();
            for(const st of beam){
                const board = [...st.board];
                for(let i=0;i<7;i++) if(!board[i]) board[i]='・';
                const bs = board.join('');
                if(seen.has(bs)) continue;
                seen.add(bs);
                results.push({board: bs, combo: ca(bs), assignments: st.assignments});
            }
        }

        finalizeResults(results, curB, es, sources);
    }, 10);
}

function finalizeResults(results,curB,es,assignedBoxes){
    results.sort((a,b)=>{
        const dc = b.combo - a.combo;
        if(dc !== 0) return dc;
        const db = countBoxesUsed(b) - countBoxesUsed(a);
        if(db !== 0) return db;
        const dd = countDeadCells(a.board) - countDeadCells(b.board);
        if(dd !== 0) return dd;
        return getMaxWordLength(b.board) - getMaxWordLength(a.board);
    });
    const unique=[],seen=new Set();
    for(const r of results){if(!seen.has(r.board)){seen.add(r.board);unique.push(r);if(unique.length>=15)break;}}
    if(unique.length===0){
        const board=[...curB];
        const fallbackChars=['あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ','た','ち','つ','て','と','な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ','ま','み','む','め','も','や','ゆ','よ','ら','り','る','れ','ろ','わ','を','ん'];
        for(const s of es)board[s]=fallbackChars[Math.floor(Math.random()*fallbackChars.length)];
        for(let j=0;j<7;j++)if(!board[j])board[j]=fallbackChars[Math.floor(Math.random()*fallbackChars.length)];
        unique.push({board:board.join(''),combo:ca(board.join('')),assignments:[]});
    }
    fo(unique);
}
function isSmallKana(c){return'ゃゅょっャュョッ'.includes(c);}
function fo(best){io=false;ob.style.display='inline-block';stb.style.display='none';if(!best||best.length===0){or2.innerHTML='<div class="no-results">No boards found.</div>';return;}const curB=pi.map(i=>i.value.trim());const bcl=['box-A','box-B','box-C','box-D','box-E'];or2.innerHTML=best.map(item=>{const words=fw(item.board);const lwp=glp(item.board);const dw=words.slice(0,6).map(w=>w.word);const bl=new Array(7).fill('');if(item.assignments){for(const a of item.assignments){if(a.boxIdx>=0&&a.boxIdx<=4){bl[a.pos]=String.fromCharCode(65+a.boxIdx);}}}const chars=item.board.split('');const cc2=chars.map((c,i)=>{let cls='char-cell';const label=bl[i];const wob=!!curB[i];if(label){cls+=' '+bcl[label.charCodeAt(0)-65];}else if(wob){cls+=' existing';}if(!lwp.has(i)){cls+=' dead';}const badge=label?`<span class="box-badge">${label}</span>`:'';const sk=isSmallKana(c)?' small-kana':'';return`<span class="${cls}"><span class="char-text${sk}">${c}</span>${badge}</span>`;}).join('');const maxLen = words.length ? Math.max(...words.map(w=>w.word.length)) : 0;return`<div class="optimize-item" data-board="${item.board}"><div class="board-layout">${cc2}</div><div class="board-details">Combo: ${item.combo} · Max word: ${maxLen}</div><div class="board-words-display">${dw.join(', ')}${words.length>6?' +'+(words.length-6)+' more':''}</div></div>`;}).join('');or2.innerHTML+=`<div class="optimize-legend"><span><span class="legend-box" style="background:#fce4ec;border-color:#c62828;"></span> Box A</span><span><span class="legend-box" style="background:#e3f2fd;border-color:#1565c0;"></span> Box B</span><span><span class="legend-box" style="background:#e8f5e9;border-color:#2e7d32;"></span> Box C</span><span><span class="legend-box" style="background:#fff3e0;border-color:#e65100;"></span> Box D</span><span><span class="legend-box" style="background:#f3e5f5;border-color:#6a1b9a;"></span> Box E (Friend)</span><span><span class="legend-box" style="background:#f5f5f5;border-color:#ddd;"></span> Existing</span><span>Dotted = not in 4+ letter word</span></div>`;document.querySelectorAll('.optimize-item').forEach(item=>item.addEventListener('click',()=>{swp(item.dataset.board);}));}
document.getElementById('loadingMsg').style.display='block';
Promise.all([
    ld(),
    fetch('https://raw.githubusercontent.com/DragonicBear/KotoDict/main/characters.json').then(r=>{if(!r.ok)throw Error('e');return r.json();}).then(data=>{characters=data;}).catch(()=>{characters=[];})
]).then(()=>{document.getElementById('loadingMsg').style.display='none';document.getElementById('mainContent').style.display='block';init();})
.catch(err=>{console.error('Load error:',err);document.getElementById('loadingMsg').textContent='⚠ Error loading dictionary.';});
})();

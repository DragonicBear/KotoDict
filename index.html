<script>
// ─── Fallback database if units.js is missing ─────────────────────────────
if (typeof unitDatabase === 'undefined') {
    window.unitDatabase = [
        { name: "ンヘループ",      letters: "んおたすけと" },
        { name: "天佑",            letters: "んおたすけと" },
        { name: "電王",            letters: "てでもうきり" },
        { name: "ティアマーター",  letters: "てきぎひびに" },
        { name: "石流龍",          letters: "いいりたほう" },
        { name: "胡蝶しのぶ",      letters: "こごちょうし" }
    ];
    console.warn('units.js missing — using built-in fallback.');
}

// ─── Globals ──────────────────────────────────────────────────────────────
let dictionary = [];
let currentRefineLogic = 'OR';

// ─── Unit Autofill Engine ─────────────────────────────────────────────────
const MAX_DROPDOWN = 30;

/**
 * Score a unit against a query string.
 * Returns -1 if no match, otherwise a numeric score (higher = better).
 * Priority: exact name match > starts-with > contains > letters contain
 */
function scoreUnit(unit, query) {
    if (!query) return 0;
    const q = query.toLowerCase();
    const name = unit.name.toLowerCase();
    if (name === q)            return 100;
    if (name.startsWith(q))   return 80;
    if (name.includes(q))     return 60;
    // hiragana inside letters
    if (unit.letters.includes(query)) return 40;
    return -1;
}

function filterUnits(query) {
    if (!query || query.length === 0) return [];
    const scored = [];
    for (const u of window.unitDatabase) {
        const s = scoreUnit(u, query);
        if (s >= 0) scored.push({ unit: u, score: s });
    }
    scored.sort((a, b) => b.score - a.score || a.unit.name.length - b.unit.name.length);
    return scored.map(s => s.unit).slice(0, MAX_DROPDOWN);
}

// ─── Dropdown UI helpers ──────────────────────────────────────────────────
let activeDropdown = null; // currently open { searchInput, dropdown, refineInput }

function openDropdown(ctx) {
    if (activeDropdown && activeDropdown !== ctx) closeDropdown(activeDropdown);
    activeDropdown = ctx;
    ctx.dropdown.classList.add('open');
}

function closeDropdown(ctx) {
    if (!ctx) return;
    ctx.dropdown.classList.remove('open');
    if (activeDropdown === ctx) activeDropdown = null;
}

function renderDropdown(ctx, units) {
    const dd = ctx.dropdown;
    if (units.length === 0) {
        dd.innerHTML = '<div class="unit-dropdown-empty">No units found</div>';
    } else {
        const rows = units.map((u, i) =>
            `<div class="unit-dropdown-item" data-index="${i}" data-letters="${u.letters}">
                <span class="unit-dropdown-name">${escapeHtml(u.name)}</span>
                <span class="unit-dropdown-letters">${escapeHtml(u.letters)}</span>
            </div>`
        ).join('');
        const footer = units.length >= MAX_DROPDOWN
            ? `<div class="unit-dropdown-count">Showing top ${MAX_DROPDOWN}</div>` : '';
        dd.innerHTML = rows + footer;

        // Tap / click on item
        dd.querySelectorAll('.unit-dropdown-item').forEach((el, i) => {
            const select = () => selectUnit(ctx, units[i]);
            el.addEventListener('mousedown', e => { e.preventDefault(); select(); });
            el.addEventListener('touchend', e => { e.preventDefault(); select(); });
        });
    }
}

function selectUnit(ctx, unit) {
    // Fill refine input with this unit's letters
    ctx.refineInput.value = unit.letters;
    ctx.refineInput.classList.add('filled');
    // Update search box to show selected unit name
    ctx.searchInput.value = unit.name;
    ctx.searchInput.classList.add('has-value');
    closeDropdown(ctx);
    performSearch();
}

function clearUnitSelection(ctx) {
    ctx.searchInput.value = '';
    ctx.searchInput.classList.remove('has-value');
    ctx.refineInput.value = '';
    ctx.refineInput.classList.remove('filled');
    closeDropdown(ctx);
    performSearch();
}

function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Wire up unit search inputs ───────────────────────────────────────────
function initUnitSearches() {
    document.querySelectorAll('.unit-search-wrap').forEach(wrap => {
        const searchInput  = wrap.querySelector('.unit-search-input');
        const clearBtn     = wrap.querySelector('.unit-clear-btn');
        const dropdown     = wrap.querySelector('.unit-dropdown');
        const refineInput  = document.getElementById(searchInput.getAttribute('data-target'));
        const ctx = { searchInput, clearBtn, dropdown, refineInput };

        // Input → show dropdown
        searchInput.addEventListener('input', () => {
            const q = searchInput.value.trim();
            if (q.length === 0) {
                closeDropdown(ctx);
                return;
            }
            const matches = filterUnits(q);
            renderDropdown(ctx, matches);
            openDropdown(ctx);
        });

        // Focus → reopen if query present
        searchInput.addEventListener('focus', () => {
            const q = searchInput.value.trim();
            if (q.length > 0 && !ctx.dropdown.classList.contains('open')) {
                const matches = filterUnits(q);
                renderDropdown(ctx, matches);
                openDropdown(ctx);
            }
        });

        // Keyboard navigation
        searchInput.addEventListener('keydown', e => {
            if (!ctx.dropdown.classList.contains('open')) return;
            const items = ctx.dropdown.querySelectorAll('.unit-dropdown-item');
            let hi = [...items].findIndex(el => el.classList.contains('highlighted'));
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (hi >= 0) items[hi].classList.remove('highlighted');
                hi = Math.min(hi + 1, items.length - 1);
                items[hi]?.classList.add('highlighted');
                items[hi]?.scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (hi >= 0) items[hi].classList.remove('highlighted');
                hi = Math.max(hi - 1, 0);
                items[hi]?.classList.add('highlighted');
                items[hi]?.scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'Enter') {
                e.preventDefault();
                const hiEl = ctx.dropdown.querySelector('.highlighted');
                if (hiEl) hiEl.dispatchEvent(new Event('mousedown'));
                else closeDropdown(ctx);
            } else if (e.key === 'Escape') {
                closeDropdown(ctx);
            }
        });

        // Clear button
        clearBtn.addEventListener('click', e => { e.preventDefault(); clearUnitSelection(ctx); });
        clearBtn.addEventListener('touchend', e => { e.preventDefault(); clearUnitSelection(ctx); });

        // Close dropdown when clicking outside
        document.addEventListener('pointerdown', e => {
            if (!wrap.contains(e.target)) closeDropdown(ctx);
        }, { passive: true });
    });
}

        ["しょうさ","",4,["勝差"],[]],["しょうさい","",5,["詳細"],[]],
        ["さんしょう","",5,["参照"],[]],["あした","",3,["明日"],[]],
        ["あいさつ","",4,["挨拶"],[]],["こう","",2,["甲"],[]],
        ["こうこう","",4,["高校"],[]],["こうこうしゃ","",5,["高校社"],[]],
        ["こうそ","",3,["酵素"],[]],["たいいく","",4,["体育"],[]],
        ["あとこうしゃく","",7,["後講釈"],[]]
    ];
    return samples.map(e => ({ word:e[0], chars:e[1]||e[0], combo:e[2], displays:e[3], themes:e[4]||[] }));
}

// ─── Dictionary load ──────────────────────────────────────────────────────
fetch('https://cdn.jsdelivr.net/npm/@kotodaman-unofficial/dictionary@0.1.1/dist/words.json')
    .then(r => { if (!r.ok) throw new Error('Network error'); return r.json(); })
    .then(data => {
        dictionary = data.map(e => ({ word:e[0], chars:e[1]||e[0], combo:e[2], displays:e[3], themes:e[4]||[] }));
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        initializeApp();
    })
    .catch(err => {
        console.error('Dictionary load failed:', err);
        dictionary = getSampleDictionary();
        document.getElementById('loadingMsg').textContent = 'Loaded sample dictionary.';
        setTimeout(() => {
            document.getElementById('loadingMsg').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            initializeApp();
        }, 1000);
    });

// ─── App init ─────────────────────────────────────────────────────────────
function initializeApp() {
    initUnitSearches();

    const clearBtn         = document.getElementById('clearBtn');
    const clearRefineBtn   = document.getElementById('clearRefineBtn');
    const posInputs        = document.querySelectorAll('.pos-input');
    const refineInputs     = document.querySelectorAll('.refine-input');
    const sortSelect       = document.getElementById('sortSelect');
    const refineSection    = document.getElementById('refineSection');
    const textSearch       = document.getElementById('textSearch');
    const requireAllBoardCheck = document.getElementById('requireAllBoard');

    // Logic toggles
    document.querySelectorAll('.logic-toggle .toggle-option').forEach(opt => {
        opt.addEventListener('click', () => {
            document.querySelectorAll('.logic-toggle .toggle-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            currentRefineLogic = opt.getAttribute('data-logic');
            refineSection.classList.toggle('and-mode', currentRefineLogic === 'AND');
            performSearch();
        });
    });

    clearBtn.addEventListener('click', e => {
        e.preventDefault();
        posInputs.forEach(i => { i.value=''; i.classList.remove('filled'); });
        textSearch.value = '';
        performSearch();
    });

    clearRefineBtn.addEventListener('click', e => {
        e.preventDefault();
        refineInputs.forEach(i => { i.value=''; i.classList.remove('filled'); });
        document.querySelectorAll('.unit-search-input').forEach(u => {
            u.value=''; u.classList.remove('has-value');
        });
        performSearch();
    });

    let searchTimeout;
    const debouncedSearch = () => { clearTimeout(searchTimeout); searchTimeout = setTimeout(performSearch, 200); };

    posInputs.forEach(input => {
        input.addEventListener('input', () => {
            input.classList.toggle('filled', input.value.length > 0);
            debouncedSearch();
        });
    });

    refineInputs.forEach(input => {
        input.addEventListener('input', () => {
            input.classList.toggle('filled', input.value.length > 0);
            debouncedSearch();
        });
    });

    textSearch.addEventListener('input', debouncedSearch);

    document.querySelectorAll('input[type="checkbox"]').forEach(i => i.addEventListener('change', performSearch));
    sortSelect.addEventListener('change', performSearch);
    requireAllBoardCheck.addEventListener('change', performSearch);

    document.querySelectorAll('label').forEach(label => {
        label.addEventListener('touchend', function(e) {
            if (e.target.tagName !== 'INPUT') {
                e.preventDefault();
                const input = this.querySelector('input');
                if (input) { input.checked = !input.checked; performSearch(); }
            }
        });
    });

    performSearch();
}

// ─── Core search logic (unchanged from original) ──────────────────────────
function performSearch() {
    const resultCount  = document.getElementById('resultCount');
    const resultList   = document.getElementById('resultList');
    const sortOrder    = document.getElementById('sortSelect').value;
    const charFilters  = Array.from(document.querySelectorAll('input[name="chars"]:checked')).map(cb => parseInt(cb.value));
    const textFilterValue = document.getElementById('textSearch').value.trim();
    const requireAllBoard = document.getElementById('requireAllBoard').checked;

    const posInputs   = Array.from(document.querySelectorAll('.pos-input'));
    const inputValues = posInputs.map(i => i.value.trim());
    const hasActivePosFilter = inputValues.some(v => v.length > 0);

    let requiredBoardIndices = [];
    if (requireAllBoard && hasActivePosFilter) {
        inputValues.forEach((val, idx) => { if (val.length > 0) requiredBoardIndices.push(idx); });
    }

    const refineConstraints = Array.from(document.querySelectorAll('.refine-input'))
        .map(input => input.value.trim().split(''))
        .filter(arr => arr.length > 0);
    const hasRefineFilter = refineConstraints.length > 0;

    let results = dictionary;

    if (charFilters.length > 0) {
        results = results.filter(word => charFilters.includes(word.word.length));
    }

    if (textFilterValue.length > 0) {
        const escaped = textFilterValue.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        const pattern = escaped.replace(/-/g,'.');
        const regex   = new RegExp(pattern);
        results = results.filter(word => regex.test(word.word));
    }

    let wordMeta      = new Map();
    let validBoardWords = [];

    results.forEach(word => {
        const len = word.word.length;
        let validOffsets = [];
        
        if (hasActivePosFilter) {
            for (let start = 0; start <= 7 - len; start++) {
                let fits = true;
                for (let i = 0; i < len; i++) {
                    const boardChar = inputValues[start + i];
                    const wordChar  = word.word[i];
                    if (boardChar && boardChar.length > 0 && !boardChar.includes(wordChar)) {
                        fits = false; break;
                    }
                }
                if (fits && requireAllBoard && requiredBoardIndices.length > 0) {
                    const coversAll = requiredBoardIndices.every(idx => idx >= start && idx < start + len);
                    if (!coversAll) fits = false;
                }
                if (fits) validOffsets.push(start);
            }
            if (validOffsets.length === 0) return;
        } else {
            validOffsets = [-1];
        }

        let isRefineMatch = false;
        if (hasRefineFilter) {
            for (let offset of validOffsets) {
                const chars = word.word.split('');
                let charsToSearch = [];
                if (offset === -1) {
                    charsToSearch = [...chars];
                } else {
                    for (let i = 0; i < chars.length; i++) {
                        const bi = offset + i;
                        if (!inputValues[bi] || inputValues[bi].length === 0) charsToSearch.push(chars[i]);
                    }
                }

                let placementPasses = false;
                if (currentRefineLogic === 'OR') {
                    placementPasses = charsToSearch.length > 0 && refineConstraints.some(c => charsToSearch.some(ch => c.includes(ch)));
                } else {
                    let pool = [...charsToSearch];
                    let ok   = true;
                    for (let c of refineConstraints) {
                        const mi = pool.findIndex(ch => c.includes(ch));
                        if (mi !== -1) pool.splice(mi,1); else { ok=false; break; }
                    }
                    placementPasses = ok;
                }

                if (placementPasses) {
                    isRefineMatch = true;
                    validOffsets  = [offset];
                    break;
                }
            }
        }

        wordMeta.set(word.word, { validOffsets, isRefineMatch });
        if (hasRefineFilter && !isRefineMatch) return;
        validBoardWords.push(word);
    });

    results = validBoardWords;

    results.sort((a, b) => {
        const ma = wordMeta.get(a.word), mb = wordMeta.get(b.word);
        if (hasRefineFilter && ma.isRefineMatch !== mb.isRefineMatch)
            return ma.isRefineMatch ? -1 : 1;
        return sortOrder === 'asc' ? a.word.length - b.word.length : b.word.length - a.word.length;
    });

    const maxResults = 300;
    const displayResults = results.slice(0, maxResults);

    if (!hasActivePosFilter && !hasRefineFilter && charFilters.length === 0 && textFilterValue.length === 0) {
        resultCount.textContent = `Waiting for input… (${dictionary.length} words)`;
        resultList.innerHTML = '';
        return;
    }

    if (results.length === 0) {
        resultCount.textContent = 'No matches found';
        resultList.innerHTML = '<div class="no-results">No words match your criteria</div>';
        return;
    }

    const suffix = results.length > maxResults ? ` (Showing first ${maxResults})` : '';
    resultCount.textContent = `Found ${results.length} words${suffix}`;

    resultList.innerHTML = displayResults.map(word => {
        const meta        = wordMeta.get(word.word);
        const displayText = word.displays[0] || word.word;
        const themesText  = word.themes.length > 0
            ? `<div class="result-themes">Theme: ${word.themes.join(', ')}</div>` : '';

        const inputValues2 = Array.from(document.querySelectorAll('.pos-input')).map(i => i.value.trim());
        let placementOffset = meta.validOffsets[0];
        const chars = word.word.split('');
        let gridIndices  = new Set();
        let refineIndices = new Set();

        if (placementOffset !== -1) {
            for (let i = 0; i < chars.length; i++) {
                const bi = placementOffset + i;
                if (inputValues2[bi] && inputValues2[bi].length > 0) gridIndices.add(i);
            }
        }

        if (hasRefineFilter && meta.isRefineMatch) {
            let avail = chars.map((_,i) => i).filter(i => !gridIndices.has(i));
            let consumed = new Set();
            for (let c of refineConstraints) {
                for (let idx of avail) {
                    if (!consumed.has(idx) && c.includes(chars[idx])) {
                        refineIndices.add(idx); consumed.add(idx);
                        if (currentRefineLogic === 'AND') break;
                    }
                }
            }
        }

        const highlightedWordHTML = chars.map((ch, i) => {
            let style = '';
            if (gridIndices.has(i))  style = 'font-weight:bold;text-decoration:underline;color:#007AFF;';
            else if (refineIndices.has(i)) {
                style = currentRefineLogic === 'AND'
                    ? 'background:#cce4ff;padding:0 1px;border-radius:2px;color:#0051d5;'
                    : 'background:#ffeb3b;padding:0 1px;border-radius:2px;color:#333;';
            }
            return style ? `<span style="${style}">${ch}</span>` : ch;
        }).join('');

        let gridHtml = '';
        if (placementOffset !== -1) {
            gridHtml = '<div class="mini-grid">';
            for (let b=0; b<7; b++) {
                let content='', cls='mini-box';
                if (b >= placementOffset && b < placementOffset + word.word.length) {
                    content = word.word[b - placementOffset];
                    cls += inputValues2[b]&&inputValues2[b].length>0 ? ' matched' : ' overlap';
                }
                gridHtml += `<div class="${cls}">${content}</div>`;
            }
            gridHtml += '</div>';
        }

        return `
            <div class="result-item${meta.isRefineMatch ? ' refine-match' : ''}">
                <div class="result-word">
                    <span>${escapeHtml(displayText)} <span style="font-weight:normal;font-size:0.8em;color:#666;">(${highlightedWordHTML})</span></span>
                    ${gridHtml}
                </div>
                <div class="result-info">${word.word.length} chars | Combo: ${word.combo}</div>
                ${themesText}
            </div>`;
    }).join('');
}

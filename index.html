<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>KotoDict</title>
    <style>
        .unit-suggestions {
            list-style-type: none;
            padding: 0;
            margin: 0;
            border: 1px solid #ccc;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .unit-suggestion-item {
            padding: 5px;
            cursor: pointer;
        }
        .unit-suggestion-item:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <div id="search-bar">
        <label for="contains-filter">Contains:</label>
        <input type="text" id="contains-filter">
        <label for="unitSearch">Character:</label>
        <input type="text" id="unitSearch" placeholder="Search for a unit">
        <ul id="unit-suggestions" class="unit-suggestions"></ul>
    </div>

    <script>
        const unitSearch = document.getElementById('unitSearch');
        const suggestionsList = document.getElementById('unit-suggestions');

        unitSearch.addEventListener('input', async function() {
            const searchTerm = this.value;
            if (searchTerm.length < 1) {
                suggestionsList.style.display = 'none';
                return;
            }
            const response = await fetch('units.json');
            const units = await response.json();
            const filteredUnits = units.filter(unit => unit.name.toLowerCase().includes(searchTerm.toLowerCase()));
            renderSuggestions(filteredUnits);
        });

        function renderSuggestions(units) {
            suggestionsList.innerHTML = '';
            if (units.length > 0) {
                suggestionsList.style.display = 'block';
                units.forEach(unit => {
                    const suggestionItem = document.createElement('li');
                    suggestionItem.classList.add('unit-suggestion-item');
                    suggestionItem.textContent = unit.name;
                    suggestionItem.onclick = function() {
                        unitSearch.value = unit.hiragana;
                        performSearch();
                    };
                    suggestionsList.appendChild(suggestionItem);
                });
            } else {
                suggestionsList.style.display = 'none';
            }
        }
    </script>

</body>
</html>
